name: Django DRF CI/CD

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v3

    - name: Настройка Python
      uses: actions/setup-python@v4
      with:
        python-python: '3.13'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск тестов
      run: |
        python manage.py test
      env:
        SECRET_KEY: 'test-secret-key'
        DEBUG: 'True'

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Деплой на удаленный сервер по SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /my/project
          git pull origin main
          # Команды для перезапуска проекта, например:
          # source venv/bin/activate && pip install -r requirements.txt && python manage.py migrate
          # sudo systemctl restart gunicorn
          # Или если через docker-compose:
          # docker-compose down && docker-compose up -d --build
